version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22 && nvm use 22
        - node --version && npm --version
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        # Amplify does not pass console environment variables to the SSR runtime.
        # Copy the allowlisted server-side variables into .env.production so Next.js loads them at runtime.
        - node scripts/amplify/write-runtime-env.mjs
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
