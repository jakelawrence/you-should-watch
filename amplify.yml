version: 1
backend:
  phases:
    build:
      commands:
        - nvm install 22 && nvm use 22
        - node --version && npm --version
        - npm ci --cache .npm --prefer-offline
        # Deploys this branch's own Cognito user pool, identity pool and migration Lambda,
        # then writes amplify_outputs.json for the frontend build.
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22 || (nvm install 22 && nvm use 22)
    build:
      commands:
        # Amplify does not pass console environment variables to the SSR runtime.
        # Copy the allowlisted server-side variables into .env.production so Next.js loads them at runtime.
        - node scripts/amplify/write-runtime-env.mjs
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
